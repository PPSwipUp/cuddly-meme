name: Paper Trading — Intraday

on:
  schedule:
    - cron: '0,30 0-21 * * 1-5'
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

jobs:
  trade-intraday:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-intraday
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install torch numpy pandas yfinance scikit-learn pyarrow

      - name: Create required directories
        run: |
          mkdir -p logs/paper_trading_intraday
          mkdir -p models/intraday
          mkdir -p data/raw_intraday
          mkdir -p data/processed_intraday

      - name: Run intraday trading cycle
        env:
          PAPER_EMAIL_ADDRESS:  ${{ secrets.PAPER_EMAIL_ADDRESS }}
          PAPER_EMAIL_PASSWORD: ${{ secrets.PAPER_EMAIL_PASSWORD }}
          PAPER_EMAIL_TO:       ${{ secrets.PAPER_EMAIL_TO }}
        run: |
          python paper_trading_intraday.py

      - name: Commit updated intraday state
        run: |
          git config user.name "paper-trading-bot"
          git config user.email "bot@noreply.github.com"
          git add logs/paper_trading_intraday/paper_state_intraday.json || true
          git add logs/paper_trading_intraday/trade_log_intraday.csv    || true
          git diff --staged --quiet || git commit -m "chore: intraday state $(date -u +%Y-%m-%d\ %H:%M)"
          git push || true
