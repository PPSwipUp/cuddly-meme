name: Paper Trading

on:
  schedule:
    - cron: '0 9 * * 1-5'
  workflow_dispatch:

jobs:
  trade:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-trading
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install torch numpy pandas yfinance scikit-learn pyarrow

      - name: Create required directories
        run: |
          mkdir -p logs/paper_trading
          mkdir -p models/base
          mkdir -p models/fine_tuned

      - name: Run trading cycle
        env:
          PAPER_EMAIL_ADDRESS:  ${{ secrets.PAPER_EMAIL_ADDRESS }}
          PAPER_EMAIL_PASSWORD: ${{ secrets.PAPER_EMAIL_PASSWORD }}
          PAPER_EMAIL_TO:       ${{ secrets.PAPER_EMAIL_TO }}
        run: |
          python paper_trading.py

      - name: Commit updated state
        run: |
          git config user.name "paper-trading-bot"
          git config user.email "bot@noreply.github.com"
          git add logs/paper_trading/paper_state.json || true
          git add logs/paper_trading/trade_log.csv    || true
          git diff --staged --quiet || git commit -m "chore: paper trading state $(date -u +%Y-%m-%d)"
          git push || true
